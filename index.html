<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#140E09" />
    <title>30 до 30</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Play:wght@400;700&family=Rubik+Mono+One&family=Russo+One&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Play:wght@400;700&family=Rubik+Mono+One&family=Russo+One&display=swap"
      />
    </noscript>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0805;
        color: #f7eedd;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        color: #c9b79a;
        font-size: 14px;
        letter-spacing: 0.08em;
      }
      #boot-error {
        max-width: 520px;
        margin: 48px auto;
        padding: 20px;
        border: 1px solid #6b4212;
        border-radius: 14px;
        background: #241812;
        line-height: 1.5;
      }
      #boot-error p {
        color: #c9b79a;
        font-size: 14px;
      }
      #boot-error pre {
        margin: 12px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: #ff9b9b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">Загружаем приключение…</div>
    </div>
    <script>
      (function () {
        function showBootError(message) {
          if (window.__appMounted) return;
          var root = document.getElementById('root');
          if (!root) return;
          var isFile = window.location.protocol === 'file:';
          root.innerHTML = '';
          var box = document.createElement('div');
          box.id = 'boot-error';
          var title = document.createElement('strong');
          title.textContent = 'Приложение не запустилось';
          var text = document.createElement('p');
          text.textContent = isFile
            ? 'Страница открыта как файл. Запусти «npm run dev» и открой http://localhost:5173 (или собери и запусти «npm run preview»).'
            : 'Открой консоль браузера — там будет точная ошибка. Ниже её краткий текст.';
          var details = document.createElement('pre');
          details.textContent = message || 'Нет подробностей';
          box.appendChild(title);
          box.appendChild(text);
          box.appendChild(details);
          root.appendChild(box);
        }

        window.__showBootError = showBootError;

        window.addEventListener('error', function (event) {
          showBootError(
            (event.message || '') +
              (event.filename ? ' — ' + event.filename + ':' + event.lineno : ''),
          );
        });

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showBootError(reason && reason.message ? reason.message : String(reason));
        });

        if (window.location.protocol === 'file:') {
          showBootError('Открыт файл index.html напрямую (file://).');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
